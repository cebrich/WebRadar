name: update
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch adsb.lol
        run: |
          curl -s "https://api.adsb.lol/v2/lat/40.323/lon/-3.864/dist/10" -o heli.json
          echo "descargado:"
          ls -lh heli.json

      - name: Check heli and notify Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          python3 << 'PY'
          import json

          with open('heli.json') as f:
              data = json.load(f)

          def es_heli(a):
              if a.get('category') == 'A7':
                  return True
              t = (a.get('t') or '').upper()
              return t.startswith('H') or t in ('EC35','EC45','EC55','AS50','AS55','AS65','B06','B407','R44','R66','AW139','S76')

          def es_bajo(a):
              alt = a.get('alt_baro')
              if alt == 'ground':
                  return True
              try:
                  return float(alt) < 1800  # ~550m
