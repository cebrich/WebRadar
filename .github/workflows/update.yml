- name: Check heli and notify Telegram
  run: |
    python3 << 'PY'
    import json, os, requests

    with open('heli.json') as f:
        data = json.load(f)

    ac = data.get('ac', [])

    # Filtrar SOLO helicópteros
    helis = [a for a in ac if a.get('category') == 'A7']

    # Sobreescribir heli.json solo con helis para que tu web solo muestre helis
    data['ac'] = helis
    data['total'] = len(helis)
    with open('heli.json', 'w') as f:
        json.dump(data, f)

    print(f"helicópteros: {len(helis)}")

