name: update
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch adsb.lol
        run: |
          curl -s "https://api.adsb.lol/v2/lat/40.323/lon/-3.864/dist/500" -o heli.json
          ls -lh heli.json

      - name: Check heli
        run: |
          python3 <<'PYEOF'
          import json
          with open('heli.json') as f:
              data = json.load(f)

          TIPOS = [
            'EC35','EC45','EC55',
            'AS50','AS55','AS65',
            'B06','B407','R44',
            'R66','AW139','S76'
          ]

          def es_heli(a):
              if a.get('category') == 'A7':
                  return True
              t = (a.get('t') or '').upper()
              if t.startswith('H'):
                  return True
              return t in TIPOS

          def alt_ft(a):
              alt = a.get('alt_baro')
              if alt == 'ground':
                  return 0
              try:
                  return float(alt)
              except:
                  return 99999

          ac = data.get('ac', [])
          helis = [a for a in ac if es_heli(a) and alt_ft(a) < 2500]
          helis_1800 = [a for a in helis if alt_ft(a) < 1800]

          data['ac'] = helis
          data['total'] = len(ac)
          data['total_detected'] = len(helis)
          data['total_1800'] = len(helis_1800)
          with open('heli.json','w') as f:
              json.dump(data, f)
          print(f"helicopteros <2500: {len(helis)} de {len(ac)} (de ellos <1800: {len(helis_1800)})")
          PYEOF

      - name: Avisar Telegram solo <1800 ft
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          N=$(python3 -c "import json; print(json.load(open('heli.json')).get('total_1800',0))")
          echo "Helis <1800: $N"
          if [ "$N" -gt 0 ]; then
            MSG="🚨 $N helicoptero(s) por DEBAJO de 1800 ft"
            curl -s --fail -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="$MSG" || echo "⚠️ Telegram devolvió error, revisa el token/chat y que hayas dado Start al bot"
          else
            echo "Nada <1800, no aviso"
          fi

      - name: Commit heli.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add heli.json
          git diff --staged --quiet && echo "sin cambios" && exit 0
          git commit -m "update heli"
          git pull --rebase origin main
          git push
