name: Update heli data
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ADS-B
        run: |
          curl -s "https://api.adsb.lol/v2/lat/40.323/lon/-3.864/dist/10" -o heli.json

      - name: Filter only helicopters
        run: |
          python3 << 'PY'
          import json
          with open('heli.json') as f:
              data = json.load(f)
          ac = data.get('ac', [])
          helis = [a for a in ac if a.get('category') == 'A7']
          data['ac'] = helis
          data['total'] = len(helis)
          with open('heli.json','w') as f:
              json.dump(data, f)
          print(f"helicópteros: {len(helis)}")
          PY

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add heli.json
          git diff --staged --quiet || git commit -m "update heli.json - helis only"
          git push
