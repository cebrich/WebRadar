name: update
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch adsb.lol
        run: |
          curl -s "https://api.adsb.lol/v2/lat/40.323/lon/-3.864/dist/500" -o heli.json
          ls -lh heli.json

      - name: Check heli
        run: |
          python3 <<'PYEOF'
          import json
          with open('heli.json') as f:
              data = json.load(f)

          TIPOS = [
            'EC35','EC45','EC55',
            'AS50','AS55','AS65',
            'B06','B407','R44',
            'R66','AW139','S76'
          ]

          def es_heli(a):
              if a.get('category') == 'A7':
                  return True
              t = (a.get('t') or '').upper()
              if t.startswith('H'):
                  return True
              return t in TIPOS

          def alt_ft(a):
              alt = a.get('alt_baro')
              if alt == 'ground':
                  return 0
              try:
                  return float(alt)
              except:
                  return 99999

          ac = data.get('ac', [])
          helis = [a for a in ac if es_heli(a) and alt_ft(a) < 2500]
          helis_1800 = [a for a in helis if alt_ft(a) < 1800]

          data['ac'] = helis
          data['total'] = len(ac)
          data['total_detected'] = len(helis)
          data['total_1800'] = len(helis_1800)
          with open('heli.json','w') as f:
              json.dump(data, f)
          print(f"helicopteros <2500: {len(helis)} de {len(ac)} (de ellos <1800: {len(helis_1800)})")
          PYEOF

      - name: Avisar Telegram solo <1800 ft
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          python3 <<'PYEOF'
          import json, os, urllib.request, urllib.parse
          with open('heli.json') as f:
              d = json.load(f)
          n1800 = d.get('total_1800', 0)
          if n1800 > 0:
              helis = [a for a in d.get('ac', []) if (a.get('alt_baro')=='ground' or (str(a.get('alt_baro')).replace('.','',1).isdigit() and float(a.get('alt_baro')) < 1800))]
              # coge hasta 5 para el mensaje
              lines = []
              for h in helis[:5]:
                  fl = h.get('flight','').strip() or h.get('hex','N/A')
                  alt = h.get('alt_baro','?')
                  lines.append(f"🚁 {fl} - {alt} ft")
              msg = f"🚨 {n1800} helicóptero(s) por DEBAJO de 1800 ft\n" + "\n".join(lines)
              data = urllib.parse.urlencode({'chat_id': os.environ['TG_CHAT'], 'text': msg}).encode()
              urllib.request.urlopen(f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/sendMessage", data=data)
              print("Telegram enviado")
          else:
              print("Nada <1800, no aviso")
          PYEOF

      - name: Commit heli.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add heli.json
          git diff --staged --quiet && echo "sin cambios" && exit 0
          git commit -m "update heli"
          git pull --rebase origin main
          git push
