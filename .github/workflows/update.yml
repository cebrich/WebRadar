name: update
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch adsb.lol
        run: |
          curl -s "https://api.adsb.lol/v2/lat/40.323/lon/-3.864/dist/500" -o heli.json
          ls -lh heli.json

      - name: Check heli
        run: |
          python3 <<'PYEOF'
          import json
          with open('heli.json') as f:
              data = json.load(f)

          TIPOS = ['EC35','EC45','EC55','AS50','AS55','AS65','B06','B407','R44','R66','AW139','S76']

          def es_heli(a):
              if a.get('category') == 'A7':
                  return True
              t = (a.get('t') or '').upper()
              if t.startswith('H'):
                  return True
              return t in TIPOS

          def alt_ft(a):
              alt = a.get('alt_baro')
              if alt == 'ground':
                  return 0
              try:
                  return float(alt)
              except:
                  return 99999

          ac = data.get('ac', [])
          helis = [a for a in ac if es_heli(a) and alt_ft(a) < 3200]
          helis_1800 = [a for a in helis if alt_ft(a) < 1800]
          helis_3200 = [a for a in helis if 1800 <= alt_ft(a) < 3200]

          data['ac'] = helis
          data['total'] = len(ac)
          data['total_detected'] = len(helis)
          data['total_1800'] = len(helis_1800)
          data['total_1800_3200'] = len(helis_3200)
          with open('heli.json','w') as f:
              json.dump(data, f)
          print(f"<3200: {len(helis)} (<1800: {len(helis_1800)}, 1800-3200: {len(helis_3200)})")
          PYEOF

      - name: Avisar Telegram ambos grupos
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 <<'PYEOF'
          import json, os, math, urllib.parse, urllib.request

          CASA_LAT, CASA_LON = 40.323, -3.864

          def haversine_km(lat1, lon1, lat2, lon2):
              R = 6371.0
              import math as m
              dlat = m.radians(lat2-lat1)
              dlon = m.radians(lon2-lon1)
              a = m.sin(dlat/2)**2 + m.cos(m.radians(lat1))*m.cos(m.radians(lat2))*m.sin(dlon/2)**2
              return 2*R*m.asin(m.sqrt(a))

          def alt_ft(a):
              v = a.get('alt_baro')
              if v == 'ground': return 0
              try: return float(v)
              except: return 99999

          with open('heli.json') as f:
              d = json.load(f)

          g1 = [a for a in d.get('ac', []) if alt_ft(a) < 1800]
          g2 = [a for a in d.get('ac', []) if 1800 <= alt_ft(a) < 3200]

          def fmt(h):
              mat = (h.get('r') or '').strip()
              flt = (h.get('flight') or '').strip()
              hx = (h.get('hex') or '').strip()
              ident = mat or flt or hx or 'N/A'
              extra = f" ({flt})" if mat and flt and mat != flt else ""
              alt = h.get('alt_baro')
              alt_txt = 'suelo' if alt == 'ground' else f"{alt} ft"
              if h.get('lat') is not None and h.get('lon') is not None:
                  dist = haversine_km(CASA_LAT, CASA_LON, h['lat'], h['lon'])
                  dist_txt = f"{dist:.1f} km"
              else:
                  dist_txt = "? km"
              return f"🚁 {ident}{extra} - {alt_txt} - {dist_txt}"

          msgs = []
          if g1:
              msgs.append(f"🟢 {len(g1)} helicóptero(s) <1800 ft:\n" + "\n".join(fmt(h) for h in g1[:10]))
          if g2:
              msgs.append(f"🟡 {len(g2)} helicóptero(s) 1800-3200 ft:\n" + "\n".join(fmt(h) for h in g2[:10]))

          if not msgs:
              print("Nada que avisar")
          else:
              msg = "\n\n".join(msgs)
              data = urllib.parse.urlencode({'chat_id': os.environ['TELEGRAM_CHAT_ID'], 'text': msg}).encode()
              try:
                  urllib.request.urlopen(f"https://api.telegram.org/bot{os.environ['TELEGRAM_TOKEN']}/sendMessage", data=data, timeout=20)
                  print("Telegram enviado")
                  print(msg)
              except Exception as e:
                  print(f"⚠️ Error Telegram: {e}")
          PYEOF

      - name: Commit heli.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add heli.json
          git diff --staged --quiet && echo "sin cambios" && exit 0
          git commit -m "update heli"
          git pull --rebase origin main
          git push
