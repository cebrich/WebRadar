name: update
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch adsb.lol
        run: |
          curl -s "https://api.adsb.lol/v2/lat/40.323/lon/-3.864/dist/500" -o heli.json
          ls -lh heli.json

      - name: Check heli
        run: |
          python3 <<'PYEOF'
          import json, math
          with open('heli.json') as f:
              data = json.load(f)

          LAT0, LON0 = 40.323, -3.864
          ALT1, ALT2 = 1800, 3200

          TIPOS = ['EC35','G2CA','EC45','EC55','AS50','AS55','AS65','B06','B407','R44','R66','AW139','S76']

          def es_heli(a):
              if a.get('category') == 'A7':
                  return True
              t = (a.get('t') or '').upper()
              if t.startswith('H'):
                  return True
              return t in TIPOS

          def alt_ft(a):
              alt = a.get('alt_baro')
              if alt == 'ground':
                  return 0
              try:
                  return float(alt)
              except:
                  return 99999

          def dist_km(lat1, lon1, lat2, lon2):
              R = 6371.0
              import math
              dlat = math.radians(lat2-lat1)
              dlon = math.radians(lon2-lon1)
              h = math.sin(dlat/2)**2 + math.cos(math.radians(lat1))*math.cos(math.radians(lat2))*math.sin(dlon/2)**2
              return 2*R*math.asin(math.sqrt(h))

          ac = data.get('ac', [])
          helis = []
          for a in ac:
              if not es_heli(a):
                  continue
              if alt_ft(a) >= ALT2:
                  continue
              if a.get('lat') is None or a.get('lon') is None:
                  continue
              d = dist_km(LAT0, LON0, a['lat'], a['lon'])
              a['_dist_km'] = round(d, 1)
              if d < 5:  # solo menos de 5 km
                  helis.append(a)

          helis_1800 = [a for a in helis if alt_ft(a) < ALT1]
          helis_3200 = [a for a in helis if ALT1 <= alt_ft(a) < ALT2]

          data['ac'] = helis
          data['total'] = len(ac)
          data['total_detected'] = len(helis)
          data['total_1800'] = len(helis_1800)
          data['total_1800_3200'] = len(helis_3200)
          with open('heli.json','w') as f:
              json.dump(data, f)
          print(f"<1800: {len(helis_1800)}, 1800-3200: {len(helis_3200)} (filtrados <5km)")
          PYEOF

      - name: Avisar Telegram 2 grupos
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 <<'PYEOF'
          import json, os, urllib.parse, urllib.request

          with open('heli.json') as f:
              d = json.load(f)

          def alt_ft(a):
              v = a.get('alt_baro')
              if v == 'ground': return 0
              try: return float(v)
              except: return 99999

          def linea(h):
              mat = (h.get('r') or '').strip()
              flt = (h.get('flight') or '').strip()
              hexc = (h.get('hex') or '').strip()
              ident = mat or flt or hexc or 'N/A'
              extra = f" ({flt})" if mat and flt and mat != flt else ""
              alt = h.get('alt_baro')
              alt_txt = 'suelo' if alt == 'ground' else f"{alt} ft"
              dist = h.get('_dist_km', '?')
              return f"🚁 {ident}{extra} - {alt_txt} - {dist} km"

          g1 = [a for a in d.get('ac', []) if alt_ft(a) < 1800]
          g2 = [a for a in d.get('ac', []) if 1800 <= alt_ft(a) < 3200]

          msgs = []
          if g1:
              msgs.append(f"🟢 <1800 ft ({len(g1)}):\n" + "\n".join(linea(h) for h in g1[:10]))
          if g2:
              msgs.append(f"🟡 1800-3200 ft ({len(g2)}):\n" + "\n".join(linea(h) for h in g2[:10]))

          if not msgs:
              print("Nada <5km, no aviso")
          else:
              msg = "🚨 Helicópteros <5km\n\n" + "\n\n".join(msgs)
              data = urllib.parse.urlencode({'chat_id': os.environ['TELEGRAM_CHAT_ID'], 'text': msg}).encode()
              try:
                  urllib.request.urlopen(f"https://api.telegram.org/bot{os.environ['TELEGRAM_TOKEN']}/sendMessage", data=data, timeout=20)
                  print("Telegram enviado")
                  print(msg)
              except Exception as e:
                  print(f"⚠️ Error Telegram: {e}")
          PYEOF

      - name: Commit heli.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add heli.json
          git diff --staged --quiet && echo "sin cambios" && exit 0
          git commit -m "update heli"
          git pull --rebase origin main
          git push
