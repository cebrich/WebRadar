<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HeliAlert Espejo - GPS</title>
<style>
body{background:#0a0f1e;color:#fff;font-family:system-ui,sans-serif;margin:0;padding:16px;text-align:center}
.card{background:#1a2338;border-radius:16px;padding:16px;margin:12px 0}
button{border:none;border-radius:16px;padding:18px;font-size:20px;font-weight:bold;width:100%;cursor:pointer}
#armBtn{background:#d32f2f;color:#fff}
#armBtn.desarmado{background:#2e7d32}
#testBtn{background:#1a2338;color:#6bb8ff;margin-top:12px}
.ok{background:#0f3d2e;color:#7dffb0;border-radius:12px;padding:12px;margin:12px 0}
</style>
</head>
<body>
<div style="font-size:48px">✈️</div>
<h1>HeliAlert Espejo</h1>
<div id="pos-label" style="opacity:.7">📍 Casa: 40.323, -3.864 (GPS no activo)</div>
<div class="card">
<button id="armBtn">ARMAR</button>
<div style="opacity:.6;margin-top:8px;font-size:14px">Armado: leyendo ./heli.json cada 15 s</div>
<button id="testBtn">🎯 Probar espejo</button>
</div>
<div id="status" class="ok">Cargando...</div>
<div class="card" style="text-align:left">
<div>🕒 Estado del espejo</div>
<div id="info" style="opacity:.8;font-size:14px;margin-top:8px"></div>
</div>
<h2 style="text-align:left">✈ Helicópteros cercanos</h2>
<div id="list" class="card">Sin helicópteros detectados.</div>
<script>
let MI_POS = {lat:40.323, lon:-3.864, gps:false};
let heliData = {ac:[], total:0};
let armado = false;
let timer = null;

if(navigator.geolocation){
  navigator.geolocation.watchPosition(pos=>{
    MI_POS.lat=pos.coords.latitude;
    MI_POS.lon=pos.coords.longitude;
    MI_POS.gps=true;
    document.getElementById('pos-label').textContent =
      `📍 Tú: ${MI_POS.lat.toFixed(3)}, ${MI_POS.lon.toFixed(3)} (GPS)`;
    render();
  }, err=>{
    console.log("GPS denegado, uso casa",err);
  }, {enableHighAccuracy:true});
}

function distKm(a,b,c,d){
  const R=6371, rad=Math.PI/180;
  const dLa=(c-a)*rad, dLo=(d-b)*rad;
  const h=Math.sin(dLa/2)**2 + Math.cos(a*rad)*Math.cos(c*rad)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

async function fetchHeli(){
  try{
    const r=await fetch('./heli.json?ts='+Date.now());
    heliData=await r.json();
  }catch(e){ console.log("no heli.json",e); }
  render();
}

function render(){
  const ahora=new Date();
  const cercanos=(heliData.ac||[]).filter(h=>{
    if(h.lat==null||h.lon==null) return false;
    return distKm(MI_POS.lat,MI_POS.lon,h.lat,h.lon)<10;
  });
  document.getElementById('status').textContent =
    `OK: ${cercanos.length} aeronaves, actualizado ${ahora.toLocaleTimeString()}`;
  document.getElementById('info').innerHTML =
    `Aeronaves totales: ${heliData.total||0}<br>Helicópteros cercanos (10km de ti): ${cercanos.length}<br>Posición usada: ${MI_POS.gps?"GPS":"Casa"}`;
  document.getElementById('list').innerHTML = cercanos.length?
    cercanos.map(h=>`<div>🚁 ${h.flight||h.hex||'N/A'} - ${h.alt_baro||'?'} ft - ${distKm(MI_POS.lat,MI_POS.lon,h.lat,h.lon).toFixed(1)} km</div>`).join(''):
    "Sin helicópteros detectados en la última lectura.";
}

document.getElementById('armBtn').onclick=function(){
  armado=!armado;
  this.textContent=armado?"DESARMAR":"ARMAR";
  this.classList.toggle('desarmado',!armado);
  if(armado){ fetchHeli(); timer=setInterval(fetchHeli,15000); }
  else clearInterval(timer);
};
document.getElementById('testBtn').onclick=fetchHeli;
fetchHeli();
</script>
</body>
</html>
