<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HeliAlert Espejo - GPS</title>
<style>
body{background:#0a0f1e;color:#fff;font-family:system-ui,sans-serif;margin:0;padding:16px;text-align:center}
.card{background:#1a2338;border-radius:16px;padding:16px;margin:12px 0}
button{border:none;border-radius:16px;padding:18px;font-size:20px;font-weight:bold;width:100%;cursor:pointer}
#armBtn{background:#d32f2f;color:#fff}
#armBtn.desarmado{background:#2e7d32}
#testBtn{background:#1a2338;color:#6bb8ff;margin-top:12px}
.ok{background:#0f3d2e;color:#7dffb0;border-radius:12px;padding:12px;margin:12px 0}
</style>
</head>
<body>
<div style="font-size:48px">✈️</div>
<h1>HeliAlert Espejo</h1>
<div id="pos-label" style="opacity:.7">📍 Casa: 40.323, -3.864 (GPS no activo)</div>
<div style="margin:6px 0"><a id="maps-link" href="https://www.google.com/maps?q=40.323,-3.864" target="_blank" style="color:#6bb8ff;font-size:14px">🗺️ Ver mi posición en Maps</a></div>
<div class="card">
<button id="armBtn">ARMAR</button>
<div style="opacity:.6;margin-top:8px;font-size:14px">Armado: leyendo ./heli.json cada 15 s</div>
<button id="testBtn">🎯 Probar espejo</button>
</div>
<div id="status" class="ok">Cargando...</div>
<div class="card" style="text-align:left">
<div>🕒 Estado del espejo</div>
<div id="info" style="opacity:.8;font-size:14px;margin-top:8px"></div>
</div>
<h2 style="text-align:left">✈ Helicópteros cercanos</h2>
<div id="list" class="card">Sin helicópteros detectados.</div>
<script>
let MI_POS = {lat:40.323, lon:-3.864, gps:false};
let heliData = {ac:[], total:0};
let armado = false;
let timer = null;
let RADIO_KM = 10;
const ALT_1 = 1800;
const ALT_2 = 2500;
let lastFetchTime = null;

function haceStr(){
  if(!lastFetchTime) return "nunca";
  const s = Math.floor((Date.now()-lastFetchTime)/1000);
  if(s<5) return "ahora mismo";
  if(s<60) return `hace ${s}s`;
  const m = Math.floor(s/60);
  if(m<60) return `hace ${m}m ${s%60}s`;
  const h = Math.floor(m/60);
  return `hace ${h}h ${m%60}m`;
}

function updatePos(pos){
    MI_POS.lat=pos.coords.latitude;
    MI_POS.lon=pos.coords.longitude;
    MI_POS.gps=true;
    const acc = pos.coords.accuracy ? ` ±${Math.round(pos.coords.accuracy)}m` : '';
    document.getElementById('pos-label').textContent =
      `📍 Tú: ${MI_POS.lat.toFixed(5)}, ${MI_POS.lon.toFixed(5)} (GPS${acc})`;
    document.getElementById('maps-link').href =
      `https://www.google.com/maps?q=${MI_POS.lat.toFixed(5)},${MI_POS.lon.toFixed(5)}`;
    render();
}
function geoError(err){
    document.getElementById('pos-label').textContent =
      `📍 Casa: ${MI_POS.lat.toFixed(3)}, ${MI_POS.lon.toFixed(3)} (GPS denegado: ${err.message})`;
    console.log("GPS error",err);
}
if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(updatePos, geoError, {enableHighAccuracy:true, timeout:10000, maximumAge:0});
  navigator.geolocation.watchPosition(updatePos, geoError, {enableHighAccuracy:true, timeout:10000, maximumAge:0});
} else {
  document.getElementById('pos-label').textContent = "📍 GPS no soportado, uso casa";
}

function distKm(a,b,c,d){
  const R=6371, rad=Math.PI/180;
  const dLa=(c-a)*rad, dLo=(d-b)*rad;
  const h=Math.sin(dLa/2)**2 + Math.cos(a*rad)*Math.cos(c*rad)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

async function fetchHeli(){
  try{
    const r=await fetch('./heli.json?ts='+Date.now());
    heliData=await r.json();
    lastFetchTime = Date.now();
  }catch(e){ console.log("no heli.json",e); }
  render();
}

function render(){
  const ahora=new Date();
  const all = heliData.ac||[];
  function getAlt(h){
    if(h.alt_baro==="ground") return 0;
    const v = parseFloat(h.alt_baro);
    return isNaN(v) ? 99999 : v;
  }
  // Detectados en radio (sin filtrar altura)
  const enRadio = all.filter(h=>{
    if(h.lat==null||h.lon==null) return false;
    return distKm(MI_POS.lat,MI_POS.lon,h.lat,h.lon)<RADIO_KM;
  });
  const g1800 = enRadio.filter(h=> getAlt(h) < ALT_1);
  const g2500 = enRadio.filter(h=>{ const a=getAlt(h); return a>=ALT_1 && a<ALT_2; });
  const visibles = [...g1800, ...g2500].sort((a,b)=>getAlt(a)-getAlt(b));
  // Si el JSON trae contadores del workflow, úsalos como referencia
  const totalAPI = heliData.total ?? all.length;

  document.getElementById('status').textContent =
    `OK: ${visibles.length} helicópteros (<${ALT_2} ft), actualizado ${haceStr()}`;
  document.getElementById('info').innerHTML =
    `Aeronaves en API: ${totalAPI}<br>`+
    `Detectados en ${RADIO_KM}km: ${enRadio.length}<br>`+
    `🟢 <${ALT_1} ft: ${g1800.length}<br>`+
    `🟡 ${ALT_1}-${ALT_2} ft: ${g2500.length}<br>`+
    `Posición usada: ${MI_POS.gps?"GPS":"Casa"}`;
  function row(h){
    const alt = h.alt_baro||'?';
    const d = distKm(MI_POS.lat,MI_POS.lon,h.lat,h.lon).toFixed(1);
    const dot = getAlt(h)<ALT_1 ? "🟢" : "🟡";
    return `<div>${dot} 🚁 ${h.flight||h.hex||'N/A'} - ${alt} ft - ${d} km</div>`;
  }
  document.getElementById('list').innerHTML = visibles.length?
    `<div style="text-align:left;margin-bottom:8px;opacity:.8">🟢 Menos de ${ALT_1} ft (${g1800.length})</div>`+
    (g1800.map(row).join('')||'<div style="opacity:.6">—</div>')+
    `<div style="text-align:left;margin:8px 0;opacity:.8">🟡 ${ALT_1}-${ALT_2} ft (${g2500.length})</div>`+
    (g2500.map(row).join('')||'<div style="opacity:.6">—</div>') :
    "Sin helicópteros detectados en la última lectura.";
}

document.getElementById('armBtn').onclick=function(){
  armado=!armado;
  this.textContent=armado?"DESARMAR":"ARMAR";
  this.classList.toggle('desarmado',!armado);
  if(armado){ fetchHeli(); timer=setInterval(fetchHeli,15000); }
  else clearInterval(timer);
};
document.getElementById('testBtn').onclick=fetchHeli;
fetchHeli();
setInterval(()=>{ if(lastFetchTime) render(); }, 5000);
</script>
</body>
</html>
